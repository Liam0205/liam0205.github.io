<svg xmlns="http://www.w3.org/2000/svg" width="760" height="870" viewBox="0 0 760 870" role="img" aria-labelledby="title desc">
  <title id="title">某银行 APP 的防御协作关系</title>
  <desc id="desc">启动期引擎内，环境与注入检查形成判定，判定影响启动和退出。代码自检保护引擎代码；运行期信号与线程观测显示插件的观察窗口受限，具体机制尚未完全定位。业务风险汇总与拦截页面另外存在，本次未进入该界面。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#555"/></marker></defs>
  <rect width="760" height="870" fill="#fff"/>
  <g font-family="Noto Sans CJK SC, sans-serif" fill="#202020">
    <g fill="#fafafa" stroke="#888" stroke-width="1.3">
      <rect x="32" y="32" width="332" height="100" rx="4"/>
      <rect x="396" y="32" width="332" height="100" rx="4"/>
    </g>
    <g font-size="21" font-weight="600">
      <text x="52" y="65">代码完整性自检</text>
      <text x="416" y="65">运行期控制与观测限制</text>
    </g>
    <g font-size="17" fill="#444">
      <text x="52" y="95">xxHash64 检查引擎代码</text>
      <text x="52" y="119">保护下方检测与判定实现</text>
      <text x="416" y="95">信号处置变化、探针停止记录</text>
      <text x="416" y="119">记录停止的具体机制尚未定位</text>
    </g>
    <g fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrow)">
      <path d="M198 133 V177"/>
      <path d="M562 133 V177"/>
    </g>
    <rect x="32" y="184" width="696" height="498" rx="5" fill="#fff" stroke="#777" stroke-width="1.3"/>
    <text x="56" y="219" font-size="21" font-weight="600">启动期防护引擎</text>
    <text x="56" y="247" font-size="17" fill="#444">初始化参与 APP 启动，不能简单删除</text>
    <g fill="#fafafa" stroke="#999" stroke-width="1.2">
      <rect x="56" y="274" width="648" height="92" rx="3"/>
      <rect x="56" y="421" width="648" height="92" rx="3"/>
      <rect x="56" y="568" width="648" height="92" rx="3"/>
    </g>
    <g font-size="21" font-weight="600">
      <text x="76" y="308">环境与注入检查</text>
      <text x="76" y="455">多项判定与失败报告</text>
      <text x="76" y="602">启动约束与终止执行</text>
    </g>
    <g font-size="17" fill="#444">
      <text x="76" y="339">读取镜像头；仅修改常规枚举接口不足以隐藏注入库</text>
      <text x="76" y="486">存在不同失败分支；修改一个判定未使全部检查通过</text>
      <text x="76" y="633">拦住已知退出后，仍可能黑屏等待或由异常终止</text>
    </g>
    <g fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrow)">
      <path d="M380 367 V409"/>
      <path d="M380 514 V556"/>
    </g>
    <g font-size="16" fill="#444">
      <text x="398" y="397">检查结果</text>
      <text x="398" y="544">失败处置</text>
    </g>
    <rect x="32" y="714" width="696" height="91" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <text x="56" y="748" font-size="21" font-weight="600">业务风险汇总与界面处置（另有组件）</text>
    <text x="56" y="780" font-size="17" fill="#444">汇总风险标记，提供提示／拦截界面；本次启动未显示该界面</text>
    <text x="32" y="843" font-size="16" fill="#444">箭头表示功能关系，不表示全部机制按此顺序执行或共用一个调度器。</text>
  </g>
</svg>
